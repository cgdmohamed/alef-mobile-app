services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alif
      POSTGRES_PASSWORD: alif_dev_password
      POSTGRES_DB: alif
    ports:
      - "5432:5432"
    volumes:
      - alif_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alif -d alif"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - alif_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  alif_postgres:
  alif_redis:
